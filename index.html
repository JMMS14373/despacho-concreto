<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A33">
<title>Despacho Concreto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app/styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-fila">
      <img src="icon.svg" alt="" class="top-logo" width="40" height="40">
      <div class="top-titulo">
        <span class="top-sub" id="topSub">PLANTA DE CONCRETO · 混凝土站</span>
        <h1 id="topTitulo">Despachos del turno</h1>
      </div>
      <span class="red" id="red" aria-live="polite"><span class="punto"></span><span id="redTxt">En línea</span></span>
    </div>
    <div class="chips" id="topChips"></div>
  </header>

  <main id="vista" tabindex="-1"></main>

  <nav class="nav" aria-label="Principal">
    <button type="button" data-vista="despachos" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Despachos</button>
    <button type="button" data-vista="nueva">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Remisión</button>
    <button type="button" data-vista="liberar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Liberar</button>
    <button type="button" data-vista="flota">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="13" height="9" rx="1"/><path d="M15 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>Flota</button>
    <button type="button" data-vista="maestros">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Maestros</button>
  </nav>
</div>

<dialog id="dlgQR" aria-label="Escanear QR del equipo">
  <div class="qr-caja">
    <video id="qrVideo" muted playsinline></video>
    <div class="qr-marco" aria-hidden="true"></div>
  </div>
  <p class="qr-ayuda">Apunte al QR pegado en el equipo · 扫描设备二维码</p>
  <button type="button" class="btn btn-sec" id="qrCancelar">Cancelar</button>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app/vendor/xlsx.full.min.js"></script>
<script src="app/vendor/jsQR.js"></script>
<script src="app/maestro.js"></script>
<script src="app/qr.js"></script>
<script src="app/pin.js"></script>
<script src="app/cierre.js"></script>
<script src="app/app.js"></script>
</body>
</html>
